<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dwarf</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <nav id="toolbar">
            <div class="tool-group">
                <h3>Désigner</h3>
                <button data-tool="designate" class="active">⛏ Creuser / Couper</button>
                <button data-tool="fishing">🎣 Pêche</button>
                <button data-tool="demolish">🚫 Démolir</button>
                <button data-priority="urgent">⚡ Urgent</button>
            </div>
            <div class="tool-group">
                <h3>Zones</h3>
                <button data-tool="stockpile">▦ Stockage</button>
                <button data-tool="stockpile:food">🍞 Nourriture</button>
                <button data-tool="stockpile:materials">🪵 Matériaux</button>
                <button data-tool="stockpile:pantry">🍯 Garde-manger</button>
                <button data-tool="farm">♠ Champ</button>
                <button data-tool="grave">⚰ Tombe</button>
                <button data-tool="infirmary">✚ Infirmerie</button>
                <button data-tool="bedroom">🛏 Chambre</button>
            </div>
            <div class="tool-group">
                <h3>Bâtir</h3>
                <button data-tool="build">🧱 Mur</button>
                <button data-tool="craft:workshop">⚒ Atelier</button>
                <button data-tool="craft:brewery">🏺 Brasserie</button>
                <button data-tool="craft:kitchen">🍳 Cuisine</button>
                <button data-tool="craft:masonry">🗿 Atelier de taille</button>
                <button data-tool="craft:forge">🔥 Forge</button>
                <button data-tool="craft:bed">🛏 Lit</button>
                <button data-tool="craft:stoneBed">🗿 Lit de pierre</button>
                <button data-tool="craft:brazier">🔥 Brasero</button>
                <button data-tool="craft:door">🚪 Porte</button>
                <button data-tool="craft:stoneDoor">🗿 Porte de pierre</button>
                <button data-tool="craft:bridge">🌉 Pont</button>
            </div>
        </nav>
        <div id="stage">
            <div id="hud"></div>
            <div id="controls">
                <div id="speed">
                    <button data-speed="0">⏸</button>
                    <button data-speed="1" class="active">▶</button>
                    <button data-speed="3">▶▶</button>
                </div>
                <div id="session">
                    <button id="save-game" title="Sauvegarder">💾</button>
                    <button id="load-game" title="Charger">📂</button>
                </div>
            </div>
            <canvas id="game"></canvas>
        </div>
        <aside>
            <p class="hint">Creuser / Couper : cliquez-glissez sur les murs (#) et les arbres (♣). Stockage et Champ : peignez des zones au sol. Cliquez sur un nain pour l'inspecter.</p>
            <div id="inspection"></div>
            <h2>Objectifs</h2>
            <div id="objectives"></div>
            <h2>Journal</h2>
            <ul id="event-log"></ul>
        </aside>
    </main>
    <script type="module" src="src/main.js"></script>
</body>
</html>
